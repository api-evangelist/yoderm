name: Yoderm
description: >-
  YoDerm was a consumer telehealth company operating an online dermatology
  platform that let patients upload photos and a medical questionnaire, receive
  a personalized treatment plan from a U.S. board-certified dermatologist within
  48 hours, and have prescriptions filled by mail-order pharmacy. Founded in
  Oakland, California around 2012, it rebranded to Apostrophe in 2019, was
  acquired by Hims & Hers Health (reported ~$190M), and ceased standalone
  operations in March 2025 when the parent folded dermatology into its main
  platform. It was surfaced as a portfolio company of 500 Global. YoDerm is a
  direct-to-consumer telehealth product with no public developer program, no
  documented API, and no OpenAPI, MCP, webhook, or SDK surface; the yoderm.com
  domain now returns HTTP 503.
